name: Installers

# Builds the installers so they can be tried. Nothing is published here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dramatis-personae/desktop make
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: apps/desktop/out/make/**
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for Apple silicon
        run: pnpm --filter @dramatis-personae/desktop make --arch=arm64
      - name: Build for Intel
        run: pnpm --filter @dramatis-personae/desktop make --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: apps/desktop/out/make/**
          retention-days: 14
